name: Tests and KPZ

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmodern-perl-perl libtemplate-perl libio-compress-perl unzip
      - name: Perl tests
        run: prove -lr t
      - name: JavaScript tests
        run: node --test t/filter.test.cjs
      - name: Build and verify KPZ
        id: package
        shell: bash
        run: |
          set -euo pipefail
          perl scripts/build-kpz.pl
          version=$(perl -ne 'print $1 if /our \$VERSION = \x27([0-9.]+)\x27/' Koha/Plugin/HKS3/SysprefDefaults.pm)
          test -n "$version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag must match plugin version v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cd dist
          unzip -t "koha-syspref-defaults-$version.kpz"
          sha256sum "koha-syspref-defaults-$version.kpz" > "koha-syspref-defaults-$version.kpz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: kpz
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kpz
          path: dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PLUGIN_VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/koha-syspref-defaults-$PLUGIN_VERSION.kpz" \
            "dist/koha-syspref-defaults-$PLUGIN_VERSION.kpz.sha256" \
            --verify-tag --generate-notes --title "Koha Syspref Defaults $PLUGIN_VERSION"
